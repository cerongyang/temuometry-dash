
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Temuometry Dash</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 102, 0, 0.4);
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #ff6600;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
    }

    /* Overlay Screens */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 15, 15, 0.92);
      backdrop-filter: blur(5px);
      z-index: 10;
      transition: opacity 0.2s ease;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 42px;
      color: #ff6600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-shadow: 2px 2px 0px #fff, 4px 4px 0px #000;
    }

    .subtitle {
      font-size: 16px;
      color: #ffcc00;
      margin-bottom: 25px;
      font-style: italic;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      width: 80%;
      max-width: 600px;
      margin-bottom: 20px;
    }

    .level-btn {
      background: linear-gradient(135deg, #ff6600, #e64a00);
      color: white;
      border: none;
      padding: 12px 5px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #992b00;
      transition: all 0.1s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .level-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #992b00;
      background: linear-gradient(135deg, #ff8533, #ff5500);
    }

    .level-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #992b00;
    }

    .level-btn .tag {
      font-size: 10px;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 5px;
      border-radius: 4px;
      margin-top: 4px;
    }

    .controls-hint {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }

    /* HUD overlay during gameplay */
    #hud {
      position: absolute;
      top: 12px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }

    .hud-title {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }

    .progress-bar-container {
      width: 40%;
      height: 16px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #ff6600;
      border-radius: 10px;
      overflow: hidden;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ffcc00, #ff6600);
      transition: width 0.1s linear;
    }

    .deal-popup {
      position: absolute;
      top: 60px;
      right: 15px;
      background: #ffcc00;
      color: #000;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      animation: pulse 1s infinite alternate;
      z-index: 5;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* Finish Modal */
    .finish-card {
      background: #222;
      border: 3px solid #ffcc00;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      max-width: 400px;
    }

    .action-btn {
      background: #ff6600;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin: 8px;
      box-shadow: 0 4px 0 #992b00;
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #992b00;
    }

    .action-btn.sec {
      background: #444;
      box-shadow: 0 4px 0 #111;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" width="800" height="450"></canvas>

    <!-- HUD Overlay -->
    <div id="hud" class="hidden">
      <div id="hud-level-name" class="hud-title">Level 1</div>
      <div class="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
      <div id="hud-percent" class="hud-title">0%</div>
    </div>

    <!-- Random Deal Popups -->
    <div id="deal-badge" class="deal-popup hidden">⚡ FLASH SALE: 99.9% OFF! ⚡</div>

    <!-- Start / Level Select Overlay -->
    <div id="menu-overlay" class="overlay">
      <h1>TEMUOMETRY DASH</h1>
      <div class="subtitle">Shop Like a Millionaire, Jump Like a Cheap Box!</div>
      <div class="btn-grid" id="level-buttons"></div>
      <div class="controls-hint">Controls: Press <b>SPACE</b>, <b>UP ARROW</b>, or <b>CLICK / TAP</b> to Jump</div>
    </div>

    <!-- Game Over / Victory Overlay -->
    <div id="end-overlay" class="overlay hidden">
      <div class="finish-card">
        <h1 id="end-title">LEVEL COMPLETE!</h1>
        <p id="end-desc" style="margin: 15px 0; color: #ccc;">You saved $0.99 with free shipping!</p>
        <div>
          <button id="retry-btn" class="action-btn">RETRY</button>
          <button id="next-btn" class="action-btn">NEXT LEVEL</button>
          <button id="menu-btn" class="action-btn sec">LEVEL SELECT</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Audio Synthesizer (Web Audio API)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.12);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(400, now + 0.1);
        osc.frequency.setValueAtTime(500, now + 0.2);
        osc.frequency.setValueAtTime(600, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    // 10 Distinct Levels Configuration
    const LEVELS = [
      { id: 1, name: "$0.99 Coupon Hop", speed: 6, bg: '#1a000c', ground: '#ff6600', pattern: 'simple' },
      { id: 2, name: "Free Shipping Slalom", speed: 6.5, bg: '#001a14', ground: '#00cc88', pattern: 'blocks' },
      { id: 3, name: "Lightning Flash Sale", speed: 7, bg: '#1a1000', ground: '#ffaa00', pattern: 'spikes_galore' },
      { id: 4, name: "Express Delivery Dash", speed: 7.5, bg: '#0d001a', ground: '#aa00ff', pattern: 'staircase' },
      { id: 5, name: "Bulk Discount Gauntlet", speed: 8, bg: '#1a0d00', ground: '#ff3300', pattern: 'tight_gaps' },
      { id: 6, name: "Bargain Bin Chaos", speed: 8.5, bg: '#001a1a', ground: '#00e6e6', pattern: 'high_low' },
      { id: 7, name: "Overnight Customs", speed: 9, bg: '#1a1a00', ground: '#d4e600', pattern: 'double_jump' },
      { id: 8, name: "Mega Coupon Stacker", speed: 9.5, bg: '#1a0000', ground: '#ff0055', pattern: 'marathon' },
      { id: 9, name: "Unclaimed Parcel Run", speed: 10, bg: '#05051a', ground: '#3355ff', pattern: 'frenzy' },
      { id: 10, name: "$0.01 Grand Finale", speed: 11, bg: '#1a001a', ground: '#ff00cc', pattern: 'boss' }
    ];

    // Canvas & Game State
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let currentLevelIdx = 0;
    let isPlaying = false;
    let animationFrameId = null;

    // Player Object
    const player = {
      x: 100,
      y: 0,
      size: 32,
      vy: 0,
      gravity: 0.9,
      jumpForce: -13.5,
      grounded: false,
      rotation: 0,
      alive: true
    };

    // World & Level State
    let distanceTraveled = 0;
    let levelLength = 5000;
    let obstacles = [];
    let particles = [];
    let groundY = 360;

    // UI Elements
    const menuOverlay = document.getElementById('menu-overlay');
    const endOverlay = document.getElementById('end-overlay');
    const hud = document.getElementById('hud');
    const levelButtonsContainer = document.getElementById('level-buttons');
    const progressBar = document.getElementById('progress-bar');
    const hudPercent = document.getElementById('hud-percent');
    const hudLevelName = document.getElementById('hud-level-name');
    const dealBadge = document.getElementById('deal-badge');

    // Generate Level Select UI
    LEVELS.forEach((lvl, idx) => {
      const btn = document.createElement('button');
      btn.className = 'level-btn';
      btn.innerHTML = `Lvl ${lvl.id}<span class="tag">$${(1 - lvl.id*0.09).toFixed(2)}</span>`;
      btn.onclick = () => startLevel(idx);
      levelButtonsContainer.appendChild(btn);
    });

    // Level Generator based on patterns
    function generateObstacles(level) {
      const list = [];
      const speed = level.speed;
      let x = 600;
      const endX = levelLength;

      while (x < endX) {
        const r = Math.random();
        
        if (level.pattern === 'simple') {
          if (r < 0.6) {
            list.push({ type: 'spike', x: x, y: groundY, w: 30, h: 36 });
            x += 350 + Math.random() * 200;
          } else {
            list.push({ type: 'box', x: x, y: groundY - 35, w: 35, h: 35 });
            x += 400 + Math.random() * 200;
          }
        } else if (level.pattern === 'blocks') {
          if (r < 0.5) {
            list.push({ type: 'box', x: x, y: groundY - 35, w: 35, h: 35 });
            x += 250 + Math.random() * 150;
          } else {
            list.push({ type: 'spike', x: x, y: groundY, w: 30, h: 36 });
            list.push({ type: 'spike', x: x + 30, y: groundY, w: 30, h: 36 });
            x += 450 + Math.random() * 200;
          }
        } else {
          // Escalating complex procedural obstacles
          const choice = Math.floor(Math.random() * 4);
          if (choice === 0) {
            // Single spike
            list.push({ type: 'spike', x: x, y: groundY, w: 30, h: 36 });
            x += 280 + Math.random() * 150;
          } else if (choice === 1) {
            // Double spike
            list.push({ type: 'spike', x: x, y: groundY, w: 30, h: 36 });
            list.push({ type: 'spike', x: x + 30, y: groundY, w: 30, h: 36 });
            x += 350 + Math.random() * 200;
          } else if (choice === 2) {
            // Box + Spike stack
            list.push({ type: 'box', x: x, y: groundY - 35, w: 35, h: 35 });
            list.push({ type: 'spike', x: x + 70, y: groundY, w: 30, h: 36 });
            x += 380 + Math.random() * 200;
          } else {
            // High platform / container box
            list.push({ type: 'box', x: x, y: groundY - 70, w: 70, h: 70 });
            x += 420 + Math.random() * 250;
          }
        }
      }
      return list;
    }

    // Input Handling
    function handleJump() {
      initAudio();
      if (!isPlaying) return;
      if (player.grounded && player.alive) {
        player.vy = player.jumpForce;
        player.grounded = false;
        playSound('jump');
        createParticles(player.x, player.y + player.size, '#ffcc00', 6);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        handleJump();
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleJump();
    }, { passive: false });

    canvas.addEventListener('mousedown', handleJump);

    // Particles System
    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          size: Math.random() * 5 + 2,
          color: color,
          life: 1
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });
      ctx.globalAlpha = 1;
    }

    // Start Level
    function startLevel(idx) {
      currentLevelIdx = idx;
      const lvl = LEVELS[currentLevelIdx];
      
      levelLength = 4000 + idx * 1000;
      distanceTraveled = 0;
      obstacles = generateObstacles(lvl);
      particles = [];

      player.y = groundY - player.size;
      player.vy = 0;
      player.rotation = 0;
      player.grounded = true;
      player.alive = true;

      hudLevelName.innerText = `Lvl ${lvl.id}: ${lvl.name}`;
      menuOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');
      hud.classList.remove('hidden');

      if (Math.random() > 0.4) {
        dealBadge.classList.remove('hidden');
        setTimeout(() => dealBadge.classList.add('hidden'), 3000);
      }

      isPlaying = true;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      gameLoop();
    }

    // Core Game Loop
    function gameLoop() {
      if (!isPlaying) return;

      const lvl = LEVELS[currentLevelIdx];

      // Update Player Physics
      if (player.alive) {
        distanceTraveled += lvl.speed;
        
        player.vy += player.gravity;
        player.y += player.vy;

        // Ground Collision
        if (player.y >= groundY - player.size) {
          player.y = groundY - player.size;
          player.vy = 0;
          player.grounded = true;
          // Snap rotation to 90deg increments on ground
          player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
        } else {
          player.rotation += 0.15; // Air spin
        }

        // Progress HUD
        const progress = Math.min(100, Math.floor((distanceTraveled / levelLength) * 100));
        progressBar.style.width = progress + '%';
        hudPercent.innerText = progress + '%';

        // Check Victory
        if (distanceTraveled >= levelLength) {
          triggerEnd(true);
          return;
        }
      }

      // Render Background
      ctx.fillStyle = lvl.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid / Temu Lines
      ctx.strokeStyle = 'rgba(255, 102, 0, 0.15)';
      ctx.lineWidth = 1;
      const gridOffset = (distanceTraveled * 0.5) % 40;
      for (let x = -gridOffset; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      // Draw Ground
      ctx.fillStyle = lvl.ground;
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, groundY, canvas.width, 4); // Ground Top Line

      // Render & Update Obstacles
      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        const screenX = obs.x - distanceTraveled + player.x;

        // Only process visible obstacles
        if (screenX > -100 && screenX < canvas.width + 100) {
          if (obs.type === 'spike') {
            // Draw Spike (Sharp Discount Icon)
            ctx.fillStyle = '#ff0033';
            ctx.beginPath();
            ctx.moveTo(screenX, obs.y);
            ctx.lineTo(screenX + obs.w / 2, obs.y - obs.h);
            ctx.lineTo(screenX + obs.w, obs.y);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.stroke();
          } else if (obs.type === 'box') {
            // Draw Cardboard Package Box
            ctx.fillStyle = '#c28546';
            ctx.fillRect(screenX, obs.y, obs.w, obs.h);
            ctx.strokeStyle = '#5c3a1e';
            ctx.strokeRect(screenX, obs.y, obs.w, obs.h);
            // Tape line
            ctx.fillStyle = '#ff6600';
            ctx.fillRect(screenX, obs.y + obs.h / 2 - 3, obs.w, 6);
          }

          // AABB Collision Check
          if (player.alive) {
            const pBox = { x: player.x + 4, y: player.y + 4, w: player.size - 8, h: player.size - 8 };
            const oBox = { x: screenX, y: obs.type === 'spike' ? obs.y - obs.h : obs.y, w: obs.w, h: obs.h };

            if (
              pBox.x < oBox.x + oBox.w &&
              pBox.x + pBox.w > oBox.x &&
              pBox.y < oBox.y + oBox.h &&
              pBox.y + pBox.h > oBox.y
            ) {
              triggerEnd(false);
            }
          }
        }
      }

      // Draw Player (Temu Yellow Parcel Box with Party Hat)
      if (player.alive) {
        ctx.save();
        ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
        ctx.rotate(player.rotation);

        // Box Body
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
        ctx.strokeStyle = '#ff6600';
        ctx.lineWidth = 3;
        ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);

        // Face details
        ctx.fillStyle = '#000';
        ctx.fillRect(-6, -6, 4, 6); // Left Eye
        ctx.fillRect(2, -6, 4, 6);  // Right Eye
        ctx.fillRect(-6, 4, 12, 3); // Smile

        ctx.restore();
      }

      // Particles
      updateParticles();
      drawParticles();

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // Victory or Defeat Handling
    function triggerEnd(success) {
      player.alive = false;
      isPlaying = false;

      if (success) {
        playSound('win');
        createParticles(player.x, player.y, '#ffcc00', 40);
        document.getElementById('end-title').innerText = '99% OFF CLEARED!';
        document.getElementById('end-title').style.color = '#00ff66';
        document.getElementById('end-desc').innerText = `You completed Level ${currentLevelIdx + 1}! Total Bargain Achieved!`;
        document.getElementById('next-btn').classList.remove('hidden');
      } else {
        playSound('crash');
        createParticles(player.x, player.y, '#ff0033', 30);
        document.getElementById('end-title').innerText = 'PACKAGE DAMAGED!';
        document.getElementById('end-title').style.color = '#ff3300';
        document.getElementById('end-desc').innerText = `You crashed at ${hudPercent.innerText}! Refund Request Pending...`;
        document.getElementById('next-btn').classList.add('hidden');
      }

      setTimeout(() => {
        endOverlay.classList.remove('hidden');
      }, 500);
    }

    // Modal Button Listeners
    document.getElementById('retry-btn').onclick = () => startLevel(currentLevelIdx);
    document.getElementById('next-btn').onclick = () => {
      if (currentLevelIdx < LEVELS.length - 1) {
        startLevel(currentLevelIdx + 1);
      } else {
        startLevel(0);
      }
    };
    document.getElementById('menu-btn').onclick = () => {
      endOverlay.classList.add('hidden');
      hud.classList.add('hidden');
      menuOverlay.classList.remove('hidden');
    };

    // Draw initial idle background frame
    ctx.fillStyle = '#1a000c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  </script>
</body>
</html>
